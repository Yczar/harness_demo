# Lints are gates, not suggestions. The checks run `flutter analyze --fatal-infos`,
# so anything listed here stops a change from reaching the reviewer.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Error masking: code that hides a failure instead of surfacing it.
    empty_catches: error
    avoid_catches_without_on_clauses: error
    unawaited_futures: error
    use_build_context_synchronously: error

linter:
  rules:
    - empty_catches
    - avoid_catches_without_on_clauses
    - unawaited_futures
    - use_build_context_synchronously
    - avoid_dynamic_calls
    - always_declare_return_types
    - prefer_final_locals
    - unnecessary_null_checks
    - avoid_print
